name: Build with go-winres (Single File)

on:
  push:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Check out code
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.22'

    - name: Install go-winres and Dependencies
      run: |
        if (!(Test-Path "go.mod")) {
            go mod init simple-app
        }
        go get github.com/tailscale/walk
        go mod tidy

        # 1. 安装 go-winres
        go install github.com/tc-hib/go-winres@latest

        # 2. 将 Go 的 bin 目录加入环境变量
        $goBin = (go env GOPATH) + "\bin"
        echo "$goBin" | Out-File -FilePath $env:GITHUB_PATH -Append
      shell: pwsh

    - name: Generate Resources via winres and Compile
      run: |
        go-winres init --force
        go-winres make

        go build -ldflags="-H windowsgui" -o simple-app.exe .
      shell: pwsh

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: simple-app-single-file
        path: simple-app.exe

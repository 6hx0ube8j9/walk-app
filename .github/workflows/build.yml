name: Build Release EXE

on:
  push:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Check out code
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.22'

    - name: Set up Environment & Dependencies
      run: |
        if (!(Test-Path "go.mod")) {
            go mod init simple-app
        }
        go get github.com/tailscale/walk
        go mod tidy

        go install github.com/tc-hib/go-winres@latest
        
        $goBin = (go env GOPATH) + "\bin"
        echo "$goBin" | Out-File -FilePath $env:GITHUB_PATH -Append
      shell: pwsh

    - name: Generate Resources and Compile EXE
      run: |
        # 让 go-winres 读取 winres.json 自动生成正确的二进制 syso
        go-winres make

        # 编译当前包，打包进单文件 exe
        go build -ldflags="-H windowsgui" -o simple-app.exe .
      shell: pwsh

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: simple-app-single-file
        path: simple-app.exe

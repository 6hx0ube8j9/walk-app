name: Build Windows App

on:
  push:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Check out code
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.22'

    - name: Build EXE
      run: |
        if (!(Test-Path "go.mod")) {
            go mod init simple-app
        }
        go get github.com/tailscale/walk
        go mod tidy
        
        # 编译生成无黑窗口的 exe
        go build -ldflags="-H windowsgui" -o simple-app.exe main.go

    - name: Prepare Manifest File
      run: |
        # 自动复制并重命名为 Windows 规范的伴生清单文件
        Copy-Item "app.manifest" "simple-app.exe.manifest"

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: simple-app-package
        path: |
          simple-app.exe
          simple-app.exe.manifest

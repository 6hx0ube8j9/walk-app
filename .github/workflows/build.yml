name: Build Windows App (Embedded Manifest)

on:
  push:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Check out code
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.22'

    - name: Setup Go-Winres and Build
      run: |
        if (!(Test-Path "go.mod")) {
            go mod init simple-app
        }
        go get github.com/tailscale/walk
        go mod tidy

        # 1. 安装 go-winres 现代资源打包工具
        go install github.com/tc-hib/go-winres@latest
        
        # 2. 将 Go 的 bin 目录加入环境变量，以便能直接调用 go-winres
        $goBin = (go env GOPATH) + "\bin"
        echo "$goBin" | Out-File -FilePath $env:GITHUB_PATH -Append
      shell: pwsh

    - name: Generate Syso and Compile EXE
      run: |
        # 3. 根据根目录下的 winres.json 和 app.manifest 生成标准的目标 syso 文件
        go-winres make

        # 4. 编译无黑窗口的单文件 exe（资源已被自动打包进去）
        go build -ldflags="-H windowsgui" -o simple-app.exe main.go

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: simple-app-single-file
        path: simple-app.exe

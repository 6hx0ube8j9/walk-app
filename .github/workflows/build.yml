name: Build Release EXE (Aligned)

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022
    strategy:
      matrix:
        goarch:
          - amd64
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: false

      - name: Install dependencies
        shell: pwsh
        run: |
          if (!(Test-Path "go.mod")) {
            go mod init simple-app
          }
          go mod tidy

      - name: Generate Windows Resources
        shell: pwsh
        run: |
          go run github.com/tc-hib/go-winres@latest make --arch ${{ matrix.goarch }}

      - name: Build EXE
        shell: pwsh
        run: |
          $env:CGO_ENABLED="0"
          $env:GOARCH="${{ matrix.goarch }}"
          go env GOOS GOARCH CGO_ENABLED
          
          go build -ldflags="-s -w -H=windowsgui" -o simple-app.exe .

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: simple-app-${{ matrix.goarch }}
          path: simple-app.exe

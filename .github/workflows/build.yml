name: Build Windows App (Single File)

on:
  push:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Check out code
      uses: actions/checkout@v4

    - name: Set up Go
      uses: setup-go@v5
      with:
        go-version: '1.22'

    - name: Build with go-winres Embedded Manifest
      run: |
        if (!(Test-Path "go.mod")) {
            go mod init simple-app
        }
        go get github.com/tailscale/walk
        go mod tidy

        # 1. 安装 go-winres 工具
        go install github.com/tc-hib/go-winres@latest
        $goBin = (go env GOPATH) + "\bin"
        echo "$goBin" | Out-File -FilePath $env:GITHUB_PATH -Append
      shell: pwsh

    - name: Generate Resources and Compile
      run: |
        # 2. 关键：必须先初始化（它会自动在项目里创建默认包含现代控件和高分屏支持的 winres.json 配置）
        go-winres init --force

        # 3. 关键：根据配置生成 rsrc_windows_amd64.syso 目标文件到根目录
        go-winres make

        # 4. 编译无黑窗口的单文件 exe（此时 syso 会被 Go 自动吞进 exe 内部）
        go build -ldflags="-H windowsgui" -o simple-app.exe main.go

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: simple-app-single-file
        path: simple-app.exe

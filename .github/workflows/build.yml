name: Build True Single-File EXE

on:
  push:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Check out code
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.22'

    - name: Install go-winres
      run: |
        if (!(Test-Path "go.mod")) {
            go mod init simple-app
        }
        go get github.com/tailscale/walk
        go mod tidy

        # 安装打包工具并加入环境变量
        go install github.com/tc-hib/go-winres@latest
        $goBin = (go env GOPATH) + "\bin"
        echo "$goBin" | Out-File -FilePath $env:GITHUB_PATH -Append
      shell: pwsh

    - name: Generate Resources and Build
      run: |
        # 1. 关键：初始化（它会在当前目录下自动创建 winres/winres.json）
        go-winres init --force

        # 2. 关键：编译生成 syso 资源文件（它会自动去 winres/ 目录读取配置，并把 syso 输出到根目录）
        go-winres make

        # 3. 编译无黑窗口的真正单文件 exe（清单已被静态缝合进 exe 内部）
        go build -ldflags="-H windowsgui" -o simple-app.exe main.go
      shell: pwsh

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: simple-app-single-file
        path: simple-app.exe

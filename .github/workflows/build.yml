name: Build Windows App

on:
  push:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Check out code
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.22'

    - name: Build Single-File EXE with Manifest
      run: |
        if (!(Test-Path "go.mod")) {
            go mod init simple-app
        }
        go get github.com/tailscale/walk
        go mod tidy

        # 安装 rsrc 并直接使用绝对路径运行，防止找不到命令
        go install github.com/akavel/rsrc@latest
        $rsrcPath = "$env:USERPROFILE\go\bin\rsrc.exe"

        # 生成 syso 资源文件
        & $rsrcPath -manifest app.manifest -o rsrc.syso

        # 编译最终的单文件 exe
        go build -ldflags="-H windowsgui" -o simple-app.exe main.go

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: simple-app-exe
        path: simple-app.exe

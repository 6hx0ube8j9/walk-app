name: Build Windows App

on:
  push:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Check out code
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.22'

    - name: Build Standalone Single-File EXE with Embedded Manifest
      run: |
        if (!(Test-Path "go.mod")) {
            go mod init simple-app
        }
        go get github.com/tailscale/walk
        go mod tidy

        # 1. 安装现代资源打包工具 go-winres
        go install github.com/tc-hib/go-winres@latest
        $goBin = (go env GOPATH) + "\bin"
        echo "$goBin" | Out-File -FilePath $env:GITHUB_PATH -Append

      shell: pwsh

    - name: Generate and Build
      run: |
        # 2. 初始化 winres 配置并生成带 ComCtl32 v6 清单的 syso 资源文件
        go-winres init --force
        go-winres make

        # 3. 编译无黑窗口的单文件 exe（清单已被静态嵌入）
        go build -ldflags="-H windowsgui" -o simple-app.exe main.go

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: simple-app-single-file
        path: simple-app.exe
